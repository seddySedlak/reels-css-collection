<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations Knowledge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=League+Spartan:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <p class="subtitle">CSS KNOWLEDGE #03</p>
        <h1>ANIMATIONS</h1>
        <div class="row">
            <div class="visual-wrapper">
                <div class="square anim-rotate"></div>
            </div>
            <div class="code-block">
                <span class="selector">.rotate {</span>
                <span class="property">animation: rotate 3s infinite;</span>
                <span class="selector">}</span>
            </div>
        </div>
        <div class="row">
            <div class="visual-wrapper">
                <div class="square anim-pulse"></div>
            </div>
            <div class="code-block">
                <span class="selector">.pulse {</span>
                <span class="property">animation: pulse 3s infinite;</span>
                <span class="selector">}</span>
            </div>
        </div>
        <div class="row">
            <div class="visual-wrapper"> <div class="square anim-slideIn"></div>
            </div>
            <div class="code-block">
                <span class="selector">.slideIn {</span>
                <span class="property">animation: slideIn 3s infinite;</span>
                <span class="selector">}</span>
            </div>
        </div>
        <div class="row">
            <div class="visual-wrapper">
                <div class="square anim-fadeIn"></div>
            </div>
            <div class="code-block">
                <span class="selector">.fadeIn {</span>
                <span class="property">animation: fadeIn 3s infinite;</span>
                <span class="selector">}</span>
            </div>
        </div>
        <div class="row">
            <div class="visual-wrapper">
                <div class="square anim-bounce"></div>
            </div>
            <div class="code-block">
                <span class="selector">.bounce {</span>
                <span class="property">animation: bounce 3s infinite;</span>
                <span class="selector">}</span>
            </div>
        </div>
    </div>
</body>
</html>
